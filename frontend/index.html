<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Three-Tier Blog Console</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="container nav">
                <div class="brand-lockup">
                    <span class="brand-kicker">Three-tier web app</span>
                    <h1 class="brand">Blog Console</h1>
                </div>
                <form class="top-search" role="search">
                    <label class="sr-only" for="nav-search">Search posts</label>
                    <span class="search-icon" aria-hidden="true"></span>
                    <input id="nav-search" type="search" placeholder="Search posts">
                </form>
                <div class="nav-actions">
                    <button id="nav-new-post" class="chip-button hidden" type="button">New post</button>
                    <button id="nav-user" class="user-button" type="button">
                        <span id="nav-user-avatar" class="user-avatar" aria-hidden="true"></span>
                        <span id="nav-user-label" class="user-label">Login</span>
                    </button>
                    <button id="nav-logout" class="chip-button hidden" type="button">Logout</button>
                </div>
            </div>
        </header>

        <section id="auth-modal" class="auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <div class="auth-backdrop" data-close-auth></div>
            <section id="auth-panel" class="panel auth-dialog">
                <div class="panel-header">
                    <div>
                        <span class="section-kicker">Identity</span>
                        <h3 id="auth-title">Sign in</h3>
                    </div>
                    <button id="close-auth-modal" class="icon-button close-button" type="button" aria-label="Close login popup"></button>
                </div>

                <form id="login-form" class="form-stack">
                    <label>
                        <span>Email</span>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" name="password" placeholder="Minimum 6 characters" required>
                    </label>
                    <button class="primary-button" type="submit">Login</button>
                    <p class="auth-switch">
                        Don't have an account?
                        <button id="switch-register" class="text-button" type="button">Sign up here</button>
                    </p>
                </form>

                <form id="register-form" class="form-stack hidden">
                    <label>
                        <span>Username</span>
                        <input type="text" name="username" placeholder="Your public name" required>
                    </label>
                    <label>
                        <span>Email</span>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </label>
                    <label>
                        <span>Password</span>
                        <input type="password" name="password" placeholder="Minimum 6 characters" required>
                    </label>
                    <label>
                        <span>Confirm password</span>
                        <input type="password" name="confirm_password" placeholder="Repeat your password" required>
                    </label>
                    <button class="primary-button" type="submit">Create account</button>
                    <p class="auth-switch">
                        Already have an account?
                        <button id="switch-login" class="text-button" type="button">Login here</button>
                    </p>
                </form>
            </section>
        </section>

        <main class="container main-layout">
            <section id="message-box" class="message-box hidden" aria-live="polite"></section>

            <section class="panel-grid">
                <section id="composer-panel" class="panel hidden">
                    <div class="panel-header">
                        <div>
                            <span class="section-kicker">Editor</span>
                            <h3 id="composer-title">Create a new post</h3>
                        </div>
                        <button id="cancel-edit" class="ghost-button hidden" type="button">Cancel edit</button>
                    </div>

                    <form id="post-form" class="form-stack">
                        <label>
                            <span>Title</span>
                            <input type="text" name="title" maxlength="200" placeholder="Clear, direct title" required>
                        </label>
                        <label>
                            <span>Content</span>
                            <textarea name="content" rows="8" placeholder="Write at least 10 characters..." required></textarea>
                        </label>
                        <button id="post-submit" class="primary-button" type="submit">Publish post</button>
                    </form>
                </section>
            </section>

            <section class="content-grid">
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <span class="section-kicker">Posts</span>
                            <h3>Feed</h3>
                        </div>
                    </div>
                    <div id="posts-list" class="post-list"></div>
                </section>

            </section>
        </main>
    </div>

    <script src="./app.js"></script>
</body>
</html>
